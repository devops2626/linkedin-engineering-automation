name: Automated LinkedIn Engineering Posts

on:
  schedule:
    # Runs Tuesdays and Thursdays at 09:00 UTC
    - cron: '0 9 * * 2,4'
  workflow_dispatch:  # Allows manual triggers from the GitHub UI

jobs:
  post-to-linkedin:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the archived post

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Auto-Poster
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        run: python main.py

      - name: Commit and Push Archived Post
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Archive published portfolio post [skip ci]"
          branch: main
          file_pattern: "archived/* posts/*"
